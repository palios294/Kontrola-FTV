<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FVE Protokol</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primary: #1a3a5a; --accent: #e67e22; --ok: #27ae60; --err: #c0392b; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 10px; margin: 0; }
        .wrapper { max-width: 700px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); font-size: 1.4rem; text-align: center; border-bottom: 3px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; }
        h2 { background: var(--primary); color: white; padding: 10px; font-size: 1rem; border-radius: 4px; margin-top: 25px; }
        h3 { color: var(--primary); border-left: 4px solid var(--accent); padding-left: 10px; font-size: 1rem; margin-top: 20px; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .input-field label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; }
        input[type="text"], input[type="date"], input[type="number"], textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 1rem; }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .row-label { width: 65%; font-size: 0.9rem; }
        .row-btns { display: flex; gap: 8px; }
        .row-btns input { display: none; }
        .row-btns label { padding: 10px 15px; background: #eee; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .row-btns input:checked + .btn-ok { background: var(--ok); color: white; }
        .row-btns input:checked + .btn-err { background: var(--err); color: white; }
        .critical-warn { color: var(--err); font-weight: bold; font-size: 0.8rem; background: #fff0f0; padding: 8px; border-radius: 4px; margin: 8px 0; border: 1px solid var(--err); }
        .measure-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .measure-table th, .measure-table td { border: 1px solid #ccc; padding: 10px; text-align: center; font-size: 0.85rem; }
        .measure-table th { background: #eee; }
        .measure-table input { border:none; text-align:center; width:100%; background:transparent; }
        canvas { border: 2px dashed #ccc; width: 100%; height: 180px; background: #fafafa; touch-action: none; margin-top: 10px; }
        .export-btn { width: 100%; padding: 20px; background: var(--ok); color: white; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-top: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        @media print { .export-btn, button { display: none !important; } }
    </style>
</head>
<body>
    <div class="wrapper" id="capture-area">
        <h1>KONTROLNÝ PROTOKOL FVE</h1>
        <div class="admin-grid">
            <div class="input-field"><label>Lokalita</label><input type="text"></div>
            <div class="input-field"><label>Dátum</label><input type="date"></div>
            <div class="input-field"><label>Kontrolór</label><input type="text"></div>
            <div class="input-field"><label>Zhotoviteľ</label><input type="text"></div>
        </div>

        <div id="dynamic-checklist"></div>

        <h2>4. MERANIA A SKÚŠKY</h2>
        <h3>4.1 DC Strana (Stringy)</h3>
        <table class="measure-table">
            <thead><tr><th>String</th><th>Voc [V]</th><th>Isc [A]</th><th>Riso [MΩ]</th></tr></thead>
            <tbody>
                <tr><td>String 1</td><td><input type="number" step="0.1"></td><td><input type="number" step="0.1"></td><td><input type="number" step="0.1"></td></tr>
                <tr><td>String 2</td><td><input type="number" step="0.1"></td><td><input type="number" step="0.1"></td><td><input type="number" step="0.1"></td></tr>
            </tbody>
        </table>
        <h3>4.2 AC Strana</h3>
        <table class="measure-table">
            <thead><tr><th>Parameter</th><th>L1</th><th>L2</th><th>L3</th></tr></thead>
            <tbody><tr><td>Napätie [V]</td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td></tr></tbody>
        </table>

        <h2>5. ZÁVEREČNÉ HODNOTENIE</h2>
        <div class="row">
            <label><input type="radio" name="final"> 🟢 Vyhovuje</label>
            <label><input type="radio" name="final"> 🟡 S výhradami</label>
            <label><input type="radio" name="final"> 🔴 Nevyhovuje</label>
        </div>
        <textarea placeholder="Poznámky..." style="height: 100px; margin-top:10px;"></textarea>

        <h2>PODPIS KONTROLÓRA</h2>
        <canvas id="canvas"></canvas>
        <button onclick="ctx.clearRect(0,0,canvas.width,canvas.height)" style="margin-top:10px;">Vymazať podpis</button>

        <button class="export-btn" onclick="downloadPDF()">ULOŽIŤ PDF</button>
    </div>

    <script>
        const data = [
            { id: "3.1", title: "Bezpečnosť práce", crit: "Práca vo výške bez istenia = STOP", items: ["OOPP", "Zabezpečenie proti pádu", "Organizácia pracoviska"] },
            { id: "3.2", title: "Nosná konštrukcia", crit: "Kotvenie len do krytiny = Nezhoda", items: ["Kotvenie do konštrukcie", "Systémové prvky", "Tesnosť strechy"] },
            { id: "3.4", title: "DC Inštalácia", crit: "Miešanie konektorov = STOP", items: ["UV káble", "Polarita", "Konektory kompatibilné"] },
            { id: "3.6", title: "Menič & Batéria", items: ["Ventilácia", "Komunikácia optimizerov", "Batéria BMS/FW update"] }
        ];

        const checklist = document.getElementById('dynamic-checklist');
        data.forEach((sec, sIdx) => {
            let html = `<h2>${sec.id} ${sec.title}</h2>`;
            if(sec.crit) html += `<div class="critical-warn">🔴 ${sec.crit}</div>`;
            sec.items.forEach((item, iIdx) => {
                const id = `c-${sIdx}-${iIdx}`;
                html += `<div class="row"><div class="row-label">${item}</div><div class="row-btns">
                    <input type="radio" name="${id}" id="${id}o" value="OK"><label for="${id}o" class="btn-ok">OK</label>
                    <input type="radio" name="${id}" id="${id}n" value="N"><label for="${id}n" class="btn-err">N</label>
                </div></div>`;
            });
            checklist.innerHTML += html;
        });

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return { x: clientX - rect.left, y: clientY - rect.top };
        }
        canvas.addEventListener('mousedown', (e) => { drawing = true; ctx.beginPath(); const pos = getPos(e); ctx.moveTo(pos.x, pos.y); });
        canvas.addEventListener('touchstart', (e) => { drawing = true; e.preventDefault(); ctx.beginPath(); const pos = getPos(e); ctx.moveTo(pos.x, pos.y); });
        canvas.addEventListener('mousemove', (e) => { if(!drawing) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); });
        canvas.addEventListener('touchmove', (e) => { if(!drawing) return; e.preventDefault(); const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); });
        window.addEventListener('mouseup', () => drawing = false);
        window.addEventListener('touchend', () => drawing = false);

        function downloadPDF() {
            const ui = document.querySelectorAll('.export-btn, button');
            ui.forEach(el => el.style.display = 'none');
            
            document.querySelectorAll('input, textarea').forEach(i => {
                if(i.type === 'radio') { if(i.checked) i.setAttribute('checked', 'checked'); }
                else i.setAttribute('value', i.value);
            });

            html2pdf().set({ margin: 10, filename: 'protokol.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' } })
            .from(document.getElementById('capture-area')).save().then(() => {
                ui.forEach(el => el.style.display = 'block');
                if(confirm("Uložené. Vymazať pre nový?")) location.reload();
            });
        }
    </script>
</body>
</html>
