<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FVE Protokol App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="wrapper" id="capture-area">
        <h1>KONTROLNÝ PROTOKOL FVE</h1>

        <div class="admin-grid">
            <div class="input-field"><label>Lokalita</label><input type="text"></div>
            <div class="input-field"><label>Dátum</label><input type="date"></div>
            <div class="input-field"><label>Kontrolór</label><input type="text"></div>
            <div class="input-field"><label>Zhotoviteľ</label><input type="text"></div>
        </div>

        <div id="dynamic-checklist"></div>

<h2>4. MERANIA A SKÚŠKY</h2>

<h3>4.1 DC Strana (Stringy)</h3>
<table class="measure-table">
    <thead>
        <tr>
            <th>String</th>
            <th>Voc [V]</th>
            <th>Isc [A]</th>
            <th>Riso [MΩ]</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>String 1</td>
            <td><input type="number" step="0.1" placeholder="0.0"></td>
            <td><input type="number" step="0.1" placeholder="0.0"></td>
            <td><input type="number" step="0.01" placeholder="> 1.0"></td>
        </tr>
        <tr>
            <td>String 2</td>
            <td><input type="number" step="0.1" placeholder="0.0"></td>
            <td><input type="number" step="0.1" placeholder="0.0"></td>
            <td><input type="number" step="0.01" placeholder="> 1.0"></td>
        </tr>
        <tr>
            <td>String 3</td>
            <td><input type="number" step="0.1" placeholder="0.0"></td>
            <td><input type="number" step="0.1" placeholder="0.0"></td>
            <td><input type="number" step="0.01" placeholder="> 1.0"></td>
        </tr>
    </tbody>
</table>

<h3>4.2 AC Strana (Sieť)</h3>
<table class="measure-table">
    <thead>
        <tr>
            <th>Meraný parameter</th>
            <th>L1-N / L1-L2</th>
            <th>L2-N / L2-L3</th>
            <th>L3-N / L3-L1</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Napätie [V]</td>
            <td><input type="number" placeholder="230"></td>
            <td><input type="number" placeholder="230"></td>
            <td><input type="number" placeholder="230"></td>
        </tr>
        <tr>
            <td>Sled fáz / Iné</td>
            <td colspan="3">
                <input type="text" placeholder="Sled fáz OK / Impedancia vypínacej slučky...">
            </td>
        </tr>
    </tbody>
</table>

        <h2>5. ZÁVEREČNÉ HODNOTENIE</h2>
        <div class="row">
            <label><input type="radio" name="final"> 🟢 Vyhovuje</label>
            <label><input type="radio" name="final"> 🟡 Vyhovuje s výhradami</label>
            <label><input type="radio" name="final"> 🔴 Nevyhovuje</label>
        </div>
        <textarea placeholder="Poznámky a zoznam opráv..." style="height: 80px; margin-top:10px;"></textarea>

        <h2>PODPIS KONTROLÓRA</h2>
        <canvas id="canvas"></canvas>
        <button onclick="ctx.clearRect(0,0,canvas.width,canvas.height)" style="margin-top:5px; font-size:10px;">Vymazať podpis</button>

        <button class="export-btn" onclick="downloadPDF()">ULOŽIŤ AKO PDF</button>
    </div>

<script>
    const checklist = document.getElementById('dynamic-checklist');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    // 1. Funkcia na reset formulára
    function resetForm() {
        const inputs = document.querySelectorAll('input[type="text"], input[type="number"], input[type="date"], textarea');
        inputs.forEach(input => {
            input.value = "";
            input.removeAttribute('value'); 
            if (input.tagName === 'TEXTAREA') input.innerHTML = "";
        });

        const radios = document.querySelectorAll('input[type="radio"]');
        radios.forEach(radio => {
            radio.checked = false;
            radio.removeAttribute('checked');
        });

        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach(cb => {
            cb.checked = false;
        });

        if (typeof ctx !== 'undefined') {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    }

    // 2. Načítanie dát z JSON
    fetch('data.json')
        .then(res => res.json())
        .then(data => {
            data.sections.forEach((sec, sIdx) => {
                let html = `<h2>${sec.id} ${sec.title}</h2>`;
                if(sec.critical) html += `<div class="critical-warn">🔴 KRITICKÉ: ${sec.critical}</div>`;
                
                sec.items.forEach((item, iIdx) => {
                    const id = `check-${sIdx}-${iIdx}`;
                    html += `
                        <div class="row">
                            <div class="row-label">${item}</div>
                            <div class="row-btns">
                                <input type="radio" name="${id}" id="${id}-ok" value="OK"><label for="${id}-ok" class="btn-ok">OK</label>
                                <input type="radio" name="${id}" id="${id}-n" value="N"><label for="${id}-n" class="btn-err">N</label>
                            </div>
                        </div>`;
                });
                checklist.innerHTML += html;
            });
        });

    // 3. Podpisovanie
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        return { x: clientX - rect.left, y: clientY - rect.top };
    }
    function start(e) { drawing = true; ctx.beginPath(); const pos = getPos(e); ctx.moveTo(pos.x, pos.y); }
    function draw(e) { 
        if(!drawing) return; 
        if (e.touches) e.preventDefault(); 
        const pos = getPos(e); 
        ctx.lineTo(pos.x, pos.y); 
        ctx.stroke(); 
        ctx.lineWidth = 2; 
        ctx.lineCap = 'round'; 
    }
    
    canvas.addEventListener('mousedown', start); canvas.addEventListener('touchstart', start);
    canvas.addEventListener('mousemove', draw); canvas.addEventListener('touchmove', draw);
    window.addEventListener('mouseup', () => drawing = false); window.addEventListener('touchend', () => drawing = false);

    // 4. EXPORT DO PDF (IBA JEDENKRÁT!)
    function downloadPDF() {
        const element = document.getElementById('capture-area');
        const uiElements = document.querySelectorAll('.export-btn, button');

        // Fix hodnôt pred uložením
        const inputs = element.querySelectorAll('input[type="number"], input[type="text"], textarea');
        inputs.forEach(input => {
            input.setAttribute('value', input.value);
            if (input.tagName === 'TEXTAREA') input.innerHTML = input.value;
        });

        const radios = element.querySelectorAll('input[type="radio"]');
        radios.forEach(radio => {
            if (radio.checked) radio.setAttribute('checked', 'checked');
            else radio.removeAttribute('checked');
        });

        // Skryť UI prvky
        uiElements.forEach(el => el.style.display = 'none');

        const opt = {
            margin: 10,
            filename: `Protokol_FVE_${new Date().getTime()}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, scrollY: 0 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        // SPRAVNÉ VOLANIE: Iba jedenkrát .save() a potom reset
        html2pdf().set(opt).from(element).save().then(() => {
            // Zobraziť UI prvky späť
            uiElements.forEach(el => el.style.display = 'block');
            
            // Reset formulára
            resetForm(); 
            alert("Protokol bol vygenerovaný a formulár vyčistený.");
        }).catch(err => {
            console.error("Chyba pri generovaní PDF:", err);
            uiElements.forEach(el => el.style.display = 'block');
        });
    }
</script>
</body>
</html>
